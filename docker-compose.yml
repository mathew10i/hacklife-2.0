services:
  postgres-auth-user:
    image: postgres:16-alpine
    container_name: hacklife-postgres-auth-user
    environment:
      POSTGRES_DB: auth_user_db
      POSTGRES_USER: hacklife
      POSTGRES_PASSWORD: hacklife
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_user_data:/var/lib/postgresql/data

  postgres-habit-streak:
    image: postgres:16-alpine
    container_name: hacklife-postgres-habit-streak
    environment:
      POSTGRES_DB: habit_streak_db
      POSTGRES_USER: hacklife
      POSTGRES_PASSWORD: hacklife
    ports:
      - "5434:5432"
    volumes:
      - postgres_habit_streak_data:/var/lib/postgresql/data

  postgres-goal-progress:
    image: postgres:16-alpine
    container_name: hacklife-postgres-goal-progress
    environment:
      POSTGRES_DB: goal_progress_db
      POSTGRES_USER: hacklife
      POSTGRES_PASSWORD: hacklife
    ports:
      - "5435:5432"
    volumes:
      - postgres_goal_progress_data:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:16-alpine
    container_name: hacklife-postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: hacklife
      POSTGRES_PASSWORD: hacklife
    ports:
      - "5436:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data

  postgres-gamification:
    image: postgres:16-alpine
    container_name: hacklife-postgres-gamification
    environment:
      POSTGRES_DB: gamification_db
      POSTGRES_USER: hacklife
      POSTGRES_PASSWORD: hacklife
    ports:
      - "5437:5432"
    volumes:
      - postgres_gamification_data:/var/lib/postgresql/data

  postgres-dashboard:
    image: postgres:16-alpine
    container_name: hacklife-postgres-dashboard
    environment:
      POSTGRES_DB: dashboard_db
      POSTGRES_USER: hacklife
      POSTGRES_PASSWORD: hacklife
    ports:
      - "5438:5432"
    volumes:
      - postgres_dashboard_data:/var/lib/postgresql/data

  postgres-api-gateway:
    image: postgres:16-alpine
    container_name: hacklife-postgres-api-gateway
    environment:
      POSTGRES_DB: api_gateway_db
      POSTGRES_USER: hacklife
      POSTGRES_PASSWORD: hacklife
    ports:
      - "5439:5432"
    volumes:
      - postgres_api_gateway_data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.7
    container_name: hacklife-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/bitnami/kafka

volumes:
  postgres_auth_user_data:
  postgres_habit_streak_data:
  postgres_goal_progress_data:
  postgres_notification_data:
  postgres_gamification_data:
  postgres_dashboard_data:
  postgres_api_gateway_data:
  kafka_data:
